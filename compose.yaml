services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MEDICLINIC_UPLOADS_PATH:-./Backend/uploads}:/app/uploads
    restart: unless-stopped
    expose:
      - "5000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_UPLOADS_BASE_URL: ${VITE_UPLOADS_BASE_URL:-}
        VITE_CLINIC_ADDRESS: ${VITE_CLINIC_ADDRESS:-}
        VITE_CLINIC_PHONE: ${VITE_CLINIC_PHONE:-}
        VITE_CLINIC_EMAIL: ${VITE_CLINIC_EMAIL:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
