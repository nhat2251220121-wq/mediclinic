<text x="1666" y="190" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#193b38">Người nhận và bảo vệ thông tin</text>
<text x="1666" y="220" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">Người nhận xác định qua request.patient_id → users.id;</text>
<text x="1666" y="245" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">không có recipient_user_id riêng trong appointment_refunds.</text>
<text x="1666" y="270" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">bank_details_encrypted nằm ở request, không phải từng dòng refund.</text>
<text x="1666" y="295" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">Thông tin tài khoản cần được bảo vệ, không công khai.</text>
<rect x="1650" y="530" width="500" height="148" rx="12" fill="#fff8e9" stroke="#e6cf9c" stroke-width="2"/>
<text x="1666" y="560" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#193b38">Giới hạn nhiều lần hoàn</text>
<text x="1666" y="590" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">UNIQUE (cancellation_request_id, payment_id) hiện có.</text>
<text x="1666" y="615" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">Một request có thể hoàn từ nhiều payment khác nhau,</text>
<text x="1666" y="640" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">nhưng không thể có nhiều dòng cùng request + payment.</text>
<text x="1666" y="665" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">Muốn chia nhiều đợt hoàn cùng payment cần rà soát constraint.</text>
