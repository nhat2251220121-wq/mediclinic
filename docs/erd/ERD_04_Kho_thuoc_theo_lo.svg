<rect x="730" y="530" width="450" height="148" rx="12" fill="#fff8e9" stroke="#e6cf9c" stroke-width="2"/>
<text x="746" y="560" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#193b38">Cách đọc tồn kho</text>
<text x="746" y="590" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">drug_batches dùng chính xác: batch_id, batch_code,</text>
<text x="746" y="615" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">quantity_received, quantity_remaining, received_on, expires_on.</text>
<text x="746" y="640" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">drugs.stock_quantity là cột lưu thường, không generated;</text>
<text x="746" y="665" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">ứng dụng duy trì tồn tổng và đối chiếu tồn đã gắn lô.</text>
<rect x="1430" y="820" width="650" height="148" rx="12" fill="#fff8e9" stroke="#e6cf9c" stroke-width="2"/>
<text x="1446" y="850" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#193b38">Liên kết logic không phải FK</text>
<text x="1446" y="880" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">stock_movements.drug_id → drugs.drug_id: không có FK.</text>
<text x="1446" y="905" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">reference_type/reference_id là tham chiếu đa hình; code có</text>
<text x="1446" y="930" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">dùng reference_type = PRESCRIPTION.</text>
<text x="1446" y="955" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#536b67">performed_by → users.id: không có FK.</text>
